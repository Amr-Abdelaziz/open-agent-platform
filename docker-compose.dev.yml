version: '3.8'

services:
  web:
    image: open-agent-platform-web-dev
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    volumes:
      # Mount the entire apps/web directory for code hot reloading
      - ./apps/web:/app/apps/web
      # Mount the root .env file to allow hot reloading of environment variables (requires restart or polling)
      - ./.env:/app/.env
      # Mount configuration files
      - ./package.json:/app/package.json
      - ./yarn.lock:/app/yarn.lock
      - ./tsconfig.json:/app/tsconfig.json
      - ./turbo.json:/app/turbo.json
      - ./.yarnrc.yml:/app/.yarnrc.yml
      # Avoid overwriting node_modules in the container with local ones
      - /app/node_modules
      - /app/apps/web/node_modules
      # Persist .next cache
      - next_cache:/app/apps/web/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      # Enable polling for file changes (useful for some systems/VMs)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Pass through all relevant environment variables from the host
      - NEXT_PUBLIC_SUPABASE_URL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY
      - NEXT_PUBLIC_BASE_API_URL
      - NEXT_PUBLIC_RAG_API_URL
      - NEXT_PUBLIC_DEPLOYMENTS
      - NEXT_PUBLIC_MCP_SERVER_URL
      - NEXT_PUBLIC_MCP_AUTH_REQUIRED
      - NEXT_PUBLIC_USE_LANGSMITH_AUTH
      - NEXT_PUBLIC_GOOGLE_AUTH_DISABLED
      - NEXT_PUBLIC_DEMO_APP
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Use a shared network if needed, or default
    networks:
      - default

networks:
  default:
    name: proxy
    external: true

volumes:
  next_cache:
